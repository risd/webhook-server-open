[program:beanstalk]
command=beanstalkd -b /var/beanstalk
stopsignal=QUIT
stopasgroup=true

[program:memcached]
command=/usr/bin/memcached -p 11211 -u webhook
autostart=true
autorestart=true
user=root
priority=100
redirect_stderr=true
stdout_logfile=/var/log/memcached/stdout.log

[program:caddy]
command=caddy reverse-proxy --from :80 --to :3000
user=root
stopsignal=QUIT
stopasgroup=true

[supervisord]
